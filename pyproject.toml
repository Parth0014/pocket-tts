[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-tts-narration"
version = "0.1.0"
description = "Block-aware long-form narration pipeline for PocketTTS"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "beautifulsoup4>=4.15,<5",
    "imageio-ffmpeg>=0.6,<1",
    "numpy>=2,<3",
    "pocket-tts[audio]==2.1.0",
    "soundfile>=0.12,<1",
    "torch>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
pocket-tts-narrate = "generate_narration:main"

[tool.setuptools]
py-modules = ["chunking", "extractor", "generate_narration", "narration_script"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
